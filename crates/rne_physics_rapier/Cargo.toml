[package]
name = "rne_physics_rapier"
description = "Rapier physics backend for Robot Native Engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Requires the repository's Rapier patch; default builds also compile against
# unmodified crates.io Rapier. See ADR 030 before enabling in another workspace.
experimental-armature = []
# Opt-in completed-step motor telemetry requires the repository's Rapier patch.
# Default builds retain compatibility with unmodified crates.io Rapier.
position-motor-diagnostics = []

[dependencies]
rapier3d = { workspace = true }
rne_core = { workspace = true }
rne_ecs = { workspace = true }
rne_math = { workspace = true }
rne_physics = { workspace = true }
rne_world = { workspace = true }

[dev-dependencies]
approx = "0.5"
