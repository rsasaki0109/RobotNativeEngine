[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "rne_py"
description = "Python bindings for Robot Native Engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
dynamic = ["version"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/rsasaki0109/RobotNativeEngine"

[tool.maturin]
features = ["extension-module"]
module-name = "rne_py"
