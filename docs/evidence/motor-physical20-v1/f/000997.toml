[workspace]

[package]
name = "motor_physical_collector"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "lib.rs"

[[bin]]
name = "motor_physical"
path = "main.rs"

[dependencies]
flate2 = "=1.1.9"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
rapier3d = { version = "=0.22.0", features = ["serde-serialize"] }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = { version = "=1.0.150", features = ["float_roundtrip", "raw_value"] }

[lints.rust]
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
too_many_lines = "warn"
