[package]
name = "isolated_motor_construction_collector"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
rapier3d = { path = "../next-motor-construction-preparation/source-copy/third_party/rapier3d", features = ["serde-serialize"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
flate2 = "=1.1.9"

[lints.rust]
unsafe_code = "forbid"
