name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual run from the Actions UI; useful when PR push events are dropped.
  workflow_dispatch:

# Keep only the latest CI run for each branch or pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The former single `workspace` job ran every stage in sequence with no caching and
# took 26-34 minutes cold. The stages are independent, so they run as parallel jobs
# and wall-clock time becomes the slowest stage. Each job restores the shared
# Swatinem cargo cache; `cargo run --locked -p xtask` itself is a cargo build, so even the
# lint job benefits.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: Format, boundaries, clippy
        run: cargo run --locked -p xtask -- ci-lint

  # The episode suites in rne_ai dominate pure test runtime, and caching cannot
  # shorten execution  Eso the tests themselves are sharded across parallel jobs
  # with nextest's deterministic hash partitioning. Asset validation runs on the
  # first shard only.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          # Readiness/history tests need baseline and historical commits.
          fetch-depth: 0
      # A change low in the dependency graph (for example the vendored Rapier)
      # rebuilds every workspace test binary beside the restored cache, which
      # can exhaust the runner's disk. Drop preinstalled SDKs the tests never use.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: Install SUMO for the TraCI co-simulation test
        run: pip install --quiet eclipse-sumo
      - name: Workspace tests (shard ${{ matrix.partition }}/3) and asset validation
        run: cargo run --locked -p xtask -- ci-test ${{ matrix.partition }}/3

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [manipulator, locomotion, assets, media]
    name: smoke (${{ matrix.partition }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: Example smokes and media checks (${{ matrix.partition }})
        run: cargo run --locked -p xtask -- ci-smoke ${{ matrix.partition }}

  rl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            examples/27_mobile_manipulator_rl/requirements-ci.txt
            examples/116_robot_workbench/python/requirements.txt
            examples/116_robot_workbench/python/requirements-mujoco.txt
      - name: Python RL smokes
        run: cargo run --locked -p xtask -- ci-rl
      - name: Independent contact-world Gymnasium tests
        run: |
          cargo build --locked -p robot_workbench --no-default-features
          python -m venv .venv-workbench
          .venv-workbench/bin/pip install -r examples/116_robot_workbench/python/requirements.txt -r examples/116_robot_workbench/python/requirements-mujoco.txt
          .venv-workbench/bin/python -m unittest discover -s examples/116_robot_workbench/python -v
      - name: SO-101 cross-simulator torque response and replay
        run: |
          .venv-workbench/bin/python examples/116_robot_workbench/python/benchmark_mujoco.py target/debug/rne-workbench assets/robots/so101/so101.urdf "$RUNNER_TEMP/so101-cross-sim.json.gz"
          .venv-workbench/bin/python examples/116_robot_workbench/python/benchmark_mujoco.py target/debug/rne-workbench "$RUNNER_TEMP/so101-cross-sim.json.gz" --replay
          .venv-workbench/bin/python examples/116_robot_workbench/python/benchmark_mujoco.py target/debug/rne-workbench assets/robots/so101/so101.urdf "$RUNNER_TEMP/so101-gravity-cross-sim.json.gz" --gravity 0 0 -9.81
          .venv-workbench/bin/python examples/116_robot_workbench/python/benchmark_mujoco.py target/debug/rne-workbench "$RUNNER_TEMP/so101-gravity-cross-sim.json.gz" --replay
      - uses: actions/upload-artifact@v4
        with:
          name: so101-cross-sim
          path: |
            ${{ runner.temp }}/so101-cross-sim.json.gz
            ${{ runner.temp }}/so101-gravity-cross-sim.json.gz

  hard-contact-drop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-contact-drop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: H1 analytic audit tests and native/MuJoCo batch comparison
        run: |
          cargo build --locked --release -p rne_physics_native --example contact_drop --example box_drop --example stack_drop --example friction_slide --example friction_threshold
          python -m venv .venv-contact
          .venv-contact/bin/pip install -r examples/116_robot_workbench/python/requirements-mujoco.txt
          RNE_THRESHOLD=target/release/examples/friction_threshold RNE_SLIDE=target/release/examples/friction_slide RNE_STACK_DROP=target/release/examples/stack_drop RNE_BOX_DROP=target/release/examples/box_drop RNE_CONTACT_DROP=target/release/examples/contact_drop .venv-contact/bin/python -m unittest discover -s scripts/contact_benchmark -v
          .venv-contact/bin/python scripts/contact_benchmark/drop.py target/release/examples/contact_drop "$RUNNER_TEMP/contact-drop.json.gz"
          .venv-contact/bin/python scripts/contact_benchmark/matched.py target/release/examples/contact_drop "$RUNNER_TEMP/contact-matched" --overdamped
          .venv-contact/bin/python scripts/contact_benchmark/verify_matched.py "$RUNNER_TEMP/contact-matched/report.json" --require-comparison
      - name: H2 box geometry, settling and batch cost
        if: success() || failure()
        run: |
          .venv-contact/bin/python scripts/contact_benchmark/box.py target/release/examples/box_drop "$RUNNER_TEMP/box-contact.json.xz"
          .venv-contact/bin/python scripts/contact_benchmark/verify_box.py "$RUNNER_TEMP/box-contact.json.xz" --require-pass
      - name: H3 dynamic stack audit (both budgets gated by integration tests)
        if: success() || failure()
        run: |
          .venv-contact/bin/python scripts/contact_benchmark/stack.py target/release/examples/stack_drop "$RUNNER_TEMP/stack-contact.json.xz"
          .venv-contact/bin/python scripts/contact_benchmark/stack.py target/release/examples/stack_drop "$RUNNER_TEMP/stack-contact.json.xz" --verify
      - name: MuJoCo stack calibration (retain quality failures)
        if: success() || failure()
        run: |
          .venv-contact/bin/python scripts/contact_benchmark/mujoco_stack.py "$RUNNER_TEMP/mujoco-stack.json.xz"
          .venv-contact/bin/python scripts/contact_benchmark/verify_mujoco_stack.py "$RUNNER_TEMP/mujoco-stack.json.xz"
      - name: Fine stack calibration and independent validation
        if: success() || failure()
        run: |
          .venv-contact/bin/python scripts/contact_benchmark/stack_matched.py target/release/examples/stack_drop "$RUNNER_TEMP/stack-matched"
          .venv-contact/bin/python scripts/contact_benchmark/verify_stack_matched.py "$RUNNER_TEMP/stack-matched"
      - name: Frozen contact-phase robustness study
        if: success() || failure()
        run: |
          .venv-contact/bin/python scripts/contact_benchmark/stack_phase.py target/release/examples/stack_drop "$RUNNER_TEMP/stack-phase"
          .venv-contact/bin/python scripts/contact_benchmark/stack_phase.py target/release/examples/stack_drop "$RUNNER_TEMP/stack-phase" --verify
      - name: Analytic Coulomb sliding audit
        if: success() || failure()
        run: |
          .venv-contact/bin/python scripts/contact_benchmark/slide.py target/release/examples/friction_slide "$RUNNER_TEMP/friction-slide.json.xz"
          .venv-contact/bin/python scripts/contact_benchmark/slide.py target/release/examples/friction_slide "$RUNNER_TEMP/friction-slide.json.xz" --verify
      - name: Constant body-load friction threshold audit
        if: success() || failure()
        run: |
          .venv-contact/bin/python scripts/contact_benchmark/threshold.py target/release/examples/friction_threshold "$RUNNER_TEMP/friction-threshold.json.xz"
          .venv-contact/bin/python scripts/contact_benchmark/threshold.py target/release/examples/friction_threshold "$RUNNER_TEMP/friction-threshold.json.xz" --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hard-contact-drop
          path: |
            ${{ runner.temp }}/contact-drop.json.gz
            ${{ runner.temp }}/contact-matched/
            ${{ runner.temp }}/box-contact.json.xz
            ${{ runner.temp }}/stack-contact.json.xz
            ${{ runner.temp }}/mujoco-stack.json.xz
            ${{ runner.temp }}/stack-matched/
            ${{ runner.temp }}/stack-phase/
            ${{ runner.temp }}/friction-slide.json.xz
            ${{ runner.temp }}/friction-threshold.json.xz
          if-no-files-found: warn

  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: Explicit CPU-only headless gate
        run: cargo run --locked -p xtask -- ci-headless
      - name: Upload LeKiwi evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lekiwi-evaluation
          path: target/lekiwi-evaluation-runs/
          if-no-files-found: warn
          retention-days: 14

  flagship:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: flagship-${{ matrix.os }}
      - name: Reproduce flagship success, failure, replay, and capsule
        run: cargo run --locked -p xtask -- flagship
      - name: Upload flagship evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagship-evidence-${{ matrix.os }}
          path: artifacts/flagship-validation/

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - name: Check the complete workspace on the declared MSRV
        run: cargo check --locked --workspace --all-targets

  release_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-contract
      - name: Compile the C and C++ controller SDK header
        shell: bash
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -Icrates/rne_plugin_sdk/include tests/compatibility/c_header_smoke.c
          c++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only -x c++ -Icrates/rne_plugin_sdk/include tests/compatibility/c_header_smoke.c
      - name: Validate version, schemas, blockers, rustdoc, and crate archives
        run: cargo run --locked -p xtask -- release-check
      - name: Verify the retained compatibility corpus
        run: cargo run --locked -p rne_compatibility_suite -- --output artifacts/compatibility/report.json
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-fixture-report
          path: artifacts/compatibility/report.json

  semver:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        packages:
          - "-p rne_ai -p rne_nav"
          - "-p rne_collision_bake -p rne_usd"
          - "-p rne_py -p rne_planning"
          - "-p rne_assets -p rne_plateau -p rne_slam"
          - "-p rne_render_wgpu -p rne_sensor -p rne_physics_rapier -p rne_urdf_import"
          - "-p rne_data -p rne_log -p rne_plugin -p rne_openscenario -p rne_traffic -p rne_traci -p rne_sumo"
          - "-p rne_core -p rne_ecs -p rne_world -p rne_robot -p rne_physics -p rne_physics_analytic -p rne_deformable"
          - "-p rne_math -p rne_render -p rne_mjcf -p rne_sdf -p rne_adapter_ros2"
          - "-p rne_plugin_sdk -p rne_physics_conformance -p rne_hardware_gateway -p rne_hardware_lekiwi"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.49.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: semver
      - name: Reject breaking changes to frozen public APIs
        shell: bash
        run: |
          # ADR 034: one registry covers every public package again, because the
          # 0.4.0 baseline is newer than the commit that introduced the two
          # packages ADR 033 had to register separately.
          registry_file="release/rust-api-baseline.toml"
          export RNE_SEMVER_REGISTRY="$registry_file"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            registry_guard_ref="origin/${{ github.base_ref }}"
          else
            registry_guard_ref="HEAD^"
          fi
          if git cat-file -e "$registry_guard_ref:$registry_file" 2>/dev/null; then
            if ! git diff --quiet "$registry_guard_ref" -- "$registry_file"; then
              mapfile -t previous_baseline_metadata < <(python3 - <<PY
          import subprocess
          import tomllib

          text = subprocess.check_output(
              ["git", "show", "$registry_guard_ref:$registry_file"],
              text=True,
          )
          previous = tomllib.loads(text)
          print(previous["release_version"])
          print(previous["baseline_revision"])
          PY
              )
              previous_release="${previous_baseline_metadata[0]-}"
              previous_baseline="${previous_baseline_metadata[1]-}"
              if [[ -n "$previous_baseline" ]] \
                && git cat-file -e "$previous_baseline^{commit}" 2>/dev/null \
                && git merge-base --is-ancestor "$previous_baseline" HEAD; then
                current_release="$(python3 - <<'PY'
          from pathlib import Path
          import os
          import tomllib

          current = tomllib.loads(Path(os.environ["RNE_SEMVER_REGISTRY"]).read_text(encoding="utf-8"))
          print(current["release_version"])
          PY
                )"
                if [[ "$previous_release" == "$current_release" ]]; then
                  echo "Rust API baseline registry is immutable within release $current_release" >&2
                  exit 1
                fi
                python3 - "$previous_release" "$current_release" <<'PY'
          import re
          import sys

          previous, current = sys.argv[1:]
          pattern = re.compile(r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$")
          previous_match = pattern.fullmatch(previous)
          current_match = pattern.fullmatch(current)
          if previous_match is None or current_match is None:
              raise SystemExit("Rust API baseline release versions must be canonical x.y.z")
          previous_parts = tuple(map(int, previous_match.groups()))
          current_parts = tuple(map(int, current_match.groups()))
          if current_parts <= previous_parts:
              raise SystemExit(
                  f"Rust API baseline release version must increase: {previous} -> {current}"
              )
          PY
                echo "release transition: allowing Rust API baseline registry update $previous_release -> $current_release"
              else
                echo "repair: allowing Rust API baseline retarget because the previous baseline is not an ancestor of HEAD"
              fi
            fi
          else
            echo "bootstrap: no Rust API baseline registry exists at $registry_guard_ref"
          fi

          mapfile -t baseline_metadata < <(python3 - <<'PY'
          from pathlib import Path
          import os
          import tomllib

          baseline = tomllib.loads(Path(os.environ["RNE_SEMVER_REGISTRY"]).read_text(encoding="utf-8"))
          for field in ("baseline_revision", "baseline_tree", "cargo_semver_checks_version"):
              print(baseline[field])
          PY
          )
          if [[ "${#baseline_metadata[@]}" -ne 3 ]]; then
            echo "Rust API baseline metadata is incomplete" >&2
            exit 1
          fi
          baseline="${baseline_metadata[0]}"
          expected_tree="${baseline_metadata[1]}"
          expected_tool="cargo-semver-checks ${baseline_metadata[2]}"
          git cat-file -e "$baseline^{commit}"
          actual_tree="$(git show -s --format=%T "$baseline")"
          if [[ "$actual_tree" != "$expected_tree" ]]; then
            echo "Rust API baseline tree mismatch: expected $expected_tree, got $actual_tree" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$baseline" HEAD
          actual_tool="$(cargo semver-checks --version)"
          if [[ "$actual_tool" != "$expected_tool" ]]; then
            echo "cargo-semver-checks mismatch: expected $expected_tool, got $actual_tool" >&2
            exit 1
          fi

          declare -A frozen_manifests=()
          while IFS=$'\t' read -r package manifest; do
            if [[ -z "$package" || -z "$manifest" || -n "${frozen_manifests[$package]+present}" ]]; then
              echo "invalid or duplicate Rust API baseline package: $package" >&2
              exit 1
            fi
            frozen_manifests["$package"]="$manifest"
          done < <(python3 - <<'PY'
          from pathlib import Path
          import os
          import tomllib

          baseline = tomllib.loads(Path(os.environ["RNE_SEMVER_REGISTRY"]).read_text(encoding="utf-8"))
          for package in baseline["package"]:
              print(f'{package["name"]}\t{package["manifest_path"]}')
          PY
          )

          requested=( ${{ matrix.packages }} )
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          packages=()
          for ((index = 0; index < ${#requested[@]}; index += 2)); do
            package="${requested[index + 1]}"
            manifest="$(jq -r --arg package "$package" '.packages[] | select(.name == $package) | .manifest_path' <<<"$metadata")"
            if [[ -z "$manifest" ]]; then
              echo "unknown current package: $package" >&2
              exit 1
            fi
            relative="${manifest#"$GITHUB_WORKSPACE/"}"
            frozen_manifest="${frozen_manifests[$package]-}"
            if [[ -z "$frozen_manifest" ]]; then
              echo "package is absent from the Rust API baseline: $package" >&2
              exit 1
            fi
            if [[ "$relative" != "$frozen_manifest" ]]; then
              echo "manifest path changed for $package: expected $frozen_manifest, got $relative" >&2
              exit 1
            fi
            git cat-file -e "$baseline:$frozen_manifest"
            packages+=("-p" "$package")
          done

          # Skip unchanged packages in this shard (CI speedup from #179).
          changed="$(git diff --name-only "$baseline" HEAD)"
          filtered=()
          for ((index = 0; index < ${#packages[@]}; index += 2)); do
            flag="${packages[index]}"
            package="${packages[index + 1]}"
            manifest="$(jq -r --arg p "$package" \
              '.packages[] | select(.name == $p) | .manifest_path' \
              <<<"$metadata")"
            crate_dir="${manifest%/Cargo.toml}"
            crate_dir="${crate_dir#"$GITHUB_WORKSPACE/"}"
            # grep -q can exit before echo drains a large diff. With pipefail,
            # that SIGPIPE incorrectly skips a changed crate's compatibility check.
            if grep -q "^${crate_dir}/\|^Cargo\.lock$\|^Cargo\.toml$" <<<"$changed"; then
              filtered+=("$flag" "$package")
            else
              echo "skip $package (no changes under $crate_dir)"
            fi
          done
          packages=("${filtered[@]}")

          if (( ${#packages[@]} == 0 )); then
            echo "all packages in this shard are unchanged; semver check skipped"
            exit 0
          fi

          # Isolated rustdoc workspaces do not inherit the root manifest's patch.
          # Compare both APIs with the same repository dependency context while
          # retaining the frozen baseline, feature selection, and release checks.
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import tomllib

          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          manifest = tomllib.loads((checkout / "Cargo.toml").read_text())
          override = manifest["patch"]["crates-io"]["rapier3d"]
          if set(override) != {"path"}:
              raise SystemExit("expected the repository's path-only Rapier patch")
          patch = (checkout / override["path"]).resolve(strict=True)
          if not patch.is_relative_to(checkout) or not (patch / "Cargo.toml").is_file():
              raise SystemExit("Rapier patch must remain inside the checkout")
          config_dir = checkout / ".cargo"
          if config_dir.is_symlink() or any(
              (config_dir / name).exists() or (config_dir / name).is_symlink()
              for name in ("config", "config.toml")
          ):
              raise SystemExit("refusing to replace an existing Cargo config")
          config_dir.mkdir(exist_ok=True)
          with (config_dir / "config.toml").open("x") as config:
              config.write(
                  "[patch.crates-io]\nrapier3d = { path = "
                  + json.dumps(str(patch)) + " }\n"
              )
          PY
          # Arm cleanup only after creating our own config successfully.
          trap 'rm -f -- .cargo/config.toml' EXIT
          cargo semver-checks check-release "${packages[@]}" --baseline-rev "$baseline" --release-type patch

  behavior_ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: Test browser behavior replay inspector
        run: node web/rne_web_viewer/replay.test.cjs
      - name: Default 10-seed behavior CI
        run: cargo run --locked -p xtask -- behavior-ci
      - name: Reproduce and minimize committed behavior failure
        run: >-
          cargo run --locked -p xtask -- behavior-ci
          --case crates/rne_ai/tests/fixtures/unitree_g1_dex3_invalid_tray.behavior-case.json
          --json artifacts/behavior-ci/fixture-report.json
          --junit artifacts/behavior-ci/fixture-junit.xml
          --artifacts artifacts/behavior-ci/fixture-replays
      - name: Replay committed behavior failure in a fresh process
        run: >-
          cargo run --locked -p xtask -- behavior-replay
          artifacts/behavior-ci/fixture-replays/unitree_g1_dex3_invalid_tray-seed-0-minimized.rne-replay
      - name: Upload behavior CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-ci-report
          path: artifacts/behavior-ci/

  evidence:
    name: evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: evidence-${{ matrix.os }}
      - name: Generate and verify v0.2 trust evidence
        run: cargo run --locked -p xtask -- evidence
      - name: Capture and verify the headless reference dataset
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p diff_drive_dataset_capture --example 73_diff_drive_dataset_capture -- artifacts/datasets/diff-drive-reference.rne-dataset --verify-golden
          cargo run --locked -p xtask -- dataset-check artifacts/datasets/diff-drive-reference.rne-dataset
          cargo run --locked -p xtask -- dataset-evaluate-depth artifacts/datasets/diff-drive-reference.rne-dataset 401 402 0.01 artifacts/datasets/diff-drive-depth-evaluation.json
      - name: Install software GPU adapters (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1-mesa-dev \
            mesa-vulkan-drivers \
            mesa-utils \
            xvfb
      - name: Capture and verify the WGPU renderer dataset
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            export WGPU_BACKEND=gl
            xvfb-run -a cargo run --locked -p g1_rgbd_sensor --example 71_g1_rgbd_sensor -- \
              --dataset artifacts/datasets/unitree-g1-wgpu.rne-dataset --require-renderer
          else
            cargo run --locked -p g1_rgbd_sensor --example 71_g1_rgbd_sensor -- \
              --dataset artifacts/datasets/unitree-g1-wgpu.rne-dataset --require-renderer
          fi
          cargo run --locked -p xtask -- dataset-check artifacts/datasets/unitree-g1-wgpu.rne-dataset
      - name: Upload trust evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-evidence-${{ matrix.os }}
          path: |
            artifacts/evidence/
            artifacts/datasets/diff-drive-reference.rne-dataset/
            artifacts/datasets/diff-drive-depth-evaluation.json
            artifacts/datasets/unitree-g1-wgpu.rne-dataset/

  parity:
    # M5 defines the GitHub-hosted Windows parity runner as its benchmark class.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: Run OSS parity flagship catalog
        run: cargo run --locked -p xtask -- parity
      - name: Upload OSS parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss-parity-report
          path: artifacts/oss-parity/report.json
      - name: Upload physics conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-conformance-report
          path: artifacts/physics-conformance/report.json
      - name: Upload scenario scale report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-scale-report
          path: artifacts/scenario-scale/report.json

  supply_chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: supply-chain
      - name: Enforce dependency policy and emit SBOM evidence
        run: cargo run --locked -p xtask -- supply-chain
      - name: Upload dependency SBOM and lock digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: artifacts/supply-chain/

  fuzz_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz-smoke
      - name: Run deterministic parser and protocol fuzz smoke
        run: cargo run --locked -p xtask -- fuzz-smoke
      - name: Upload fuzz campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-report
          path: artifacts/fuzz-smoke/report.json

  # Aggregate gate so tooling that watched the old single job has one required
  # context to point at; it passes only when every stage passes.
  workspace:
    runs-on: ubuntu-latest
    needs: [lint, test, smoke, rl, headless, flagship, msrv, release_contract, semver, behavior_ci, evidence, parity, supply_chain, fuzz_smoke]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: final-exit-ci
      - name: Record the locked CI exit verdict
        run: >-
          cargo run --locked -p xtask -- release-exit --scope ci
          --result lint=${{ needs.lint.result }}
          --result test=${{ needs.test.result }}
          --result smoke=${{ needs.smoke.result }}
          --result rl=${{ needs.rl.result }}
          --result headless=${{ needs.headless.result }}
          --result flagship=${{ needs.flagship.result }}
          --result msrv=${{ needs.msrv.result }}
          --result release_contract=${{ needs.release_contract.result }}
          --result semver=${{ needs.semver.result }}
          --result behavior_ci=${{ needs.behavior_ci.result }}
          --result evidence=${{ needs.evidence.result }}
          --result parity=${{ needs.parity.result }}
          --result supply_chain=${{ needs.supply_chain.result }}
          --result fuzz_smoke=${{ needs.fuzz_smoke.result }}
      - name: Upload final CI exit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-exit-ci
          path: artifacts/release-exit/ci.json
