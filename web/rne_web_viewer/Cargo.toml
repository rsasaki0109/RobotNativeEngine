# Standalone (non-workspace) crate: the web viewer must not join the root
# workspace, whose native-only feature unification would leak into wasm builds.
[workspace]

[package]
name = "rne_web_viewer"
description = "Browser WASM viewer for Robot Native Engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rne_ai = { path = "../../crates/rne_ai" }
rne_assets = { path = "../../crates/rne_assets" }
rne_core = { path = "../../crates/rne_core" }
rne_ecs = { path = "../../crates/rne_ecs" }
rne_math = { path = "../../crates/rne_math" }
rne_planning = { path = "../../crates/rne_planning" }
rne_nav = { path = "../../crates/rne_nav" }
rne_physics = { path = "../../crates/rne_physics" }
# MJCF joint armature for the pretrained walking policy needs the
# repository Rapier patch below and this feature.
rne_physics_rapier = { path = "../../crates/rne_physics_rapier", features = ["experimental-armature"] }
rne_render = { path = "../../crates/rne_render" }
rne_render_wgpu = { path = "../../crates/rne_render_wgpu", features = ["viewer"] }
rne_robot = { path = "../../crates/rne_robot" }
rne_urdf_import = { path = "../../crates/rne_urdf_import" }
rne_world = { path = "../../crates/rne_world" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Performance",
    "Window",
] }
winit = { version = "0.30", features = ["rwh_05"] }
wgpu = { version = "24", features = ["webgl"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Use the repository's patched Rapier, as the root workspace does, so physics
# in the browser matches native runs (and supports joint armature).
[patch.crates-io]
rapier3d = { path = "../../third_party/rapier3d" }

# Physics and the policy are far too slow unoptimized; keep the crate itself
# debuggable but optimize dependencies in dev and test builds.
[profile.dev.package."*"]
opt-level = 2
