# unitree_rl_gym's walking H1: ten leg joints actuated, upper body merged into
# the pelvis. Every link collides with the floor through the convex hull of
# its mesh, as the upstream MuJoCo scene's mesh geoms do; unlike there, links do
# not collide with each other. See h1_description/UPSTREAM.md.
kind = "urdf"
model_name = "unitree_h1_walk"

[urdf]
path = "h1_description/h1.rne.urdf"
base_body_type = "dynamic"
initial_translation_m = [0.0, 1.05, 0.0]
initial_rotation_rpy = [-1.5707963267948966, 0.0, 0.0]
articulation = true
collisions = true
mesh_collisions = true
self_collisions = false
multibody = true
weld_fixed_children = true
use_declared_inertial_masses = true
use_joint_origin_rpy = true
convex_mesh_collisions = true
