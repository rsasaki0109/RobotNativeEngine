[package]
name = "g1_sim2sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rne_ai = { workspace = true }
rne_core = { workspace = true }
rne_ecs = { workspace = true }
rne_math = { workspace = true }
rne_physics = { workspace = true }
# Joint armature (MJCF `armature`) needs the repository-only Rapier extension.
rne_physics_rapier = { workspace = true, features = ["experimental-armature"] }
rne_robot = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[[example]]
name = "144_g1_sim2sim"
path = "main.rs"

[package.metadata.cargo-machete]
# rne_physics_rapier is referenced only to enable "experimental-armature",
# which RevoluteJointArmature on the leg joints requires.
ignored = ["rne_physics_rapier"]
